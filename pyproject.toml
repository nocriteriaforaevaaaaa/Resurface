[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-grounded-video-detection"
version = "0.1.0"
description = "Evidence-grounded detection of old videos reposted as recent Nepal news"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
