services:
  db:
    image: postgres:16
    container_name: evidence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidence_user
      POSTGRES_PASSWORD: evidence_pass
      POSTGRES_DB: evidence_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence_user -d evidence_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: evidence_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://evidence_user:evidence_pass@db:5432/evidence_db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
