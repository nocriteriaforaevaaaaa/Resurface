# Verified Nepal news source list (Section 5.3 "Historical Dataset Construction").
#
# Fill this in with actual verified YouTube channels / public archives before running
# scripts/collect_dataset.py. Only include sources with identifiable ownership and a
# public publication record (Section 5.4 step 6) -- unverifiable channels should be
# left out of the "is_verified" subset used for the gold evaluation data (Section 7.6).
#
# reliability_tier: 1 (most reliable, e.g. wire services / major national broadcasters)
#                    .. 5 (least reliable). Feeds the metadata_score term in Eq. 5.3.
#
# event_categories are a hint for annotators, not an automatic label -- category and
# location are still confirmed manually per Section 5.4 step 5.
#
# The three entries below were identified and verified (channel identity + upload date
# via yt-dlp metadata) for a small seed run of the collection pipeline -- see
# scripts/collect_seed_videos.py. Add more channels here and re-run
# scripts/collect_dataset.py to grow the repository beyond this seed set.

sources:
