    platform: youtube
    homepage_url: "https://www.youtube.com/channel/UCTGVQIvtPu5kqNI5ABmN8Fw"
    channel_url: "https://www.youtube.com/channel/UCTGVQIvtPu5kqNI5ABmN8Fw/videos"
    reliability_tier: 1
    is_verified: true
    event_categories: [flood, landslide, earthquake, fire, protest, road_accident]

